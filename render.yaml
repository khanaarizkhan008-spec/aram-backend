services:
  # Backend Node/Express API Service
  - type: web
    name: aram-brand-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://aram-brand-frontend.onrender.com
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # Frontend Vite React Static Site
  - type: static_site
    name: aram-brand-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://aram-brand-backend.onrender.com
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
